name: Deploy to Joule Studio

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Overwrite existing deployment'
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package solution
        run: zip -r solution.zip assets solution.yaml .build

      - name: Import and deploy solution
        env:
          JOULE_HOST: ${{ secrets.JOULE_STUDIO_HOST }}
          JOULE_TOKEN: ${{ secrets.JOULE_STUDIO_TOKEN }}
          OVERWRITE: ${{ inputs.force }}
        run: |
          # Build JSON payload with Python (avoids shell arg list limit for large ZIPs)
          python3 -c "
          import base64, json, os
          z = base64.b64encode(open('solution.zip','rb').read()).decode()
          payload = {
            'semanticVersion': 'main',
            'zip': z,
            'overwrite': os.environ['OVERWRITE'] == 'true'
          }
          hint = os.environ.get('SOLUTION_ID_HINT', '').strip()
          if hint: payload['solutionId'] = hint
          json.dump(payload, open('/tmp/payload.json', 'w'))
          "

          # Import solution ZIP
          IMPORT_RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "$JOULE_HOST/build-service/importZip" \
            -H "Authorization: Bearer $JOULE_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/payload.json)

          HTTP_CODE=$(echo "$IMPORT_RESPONSE" | tail -1)
          BODY=$(echo "$IMPORT_RESPONSE" | head -1)

          echo "Import response ($HTTP_CODE): $BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Import failed"
            exit 1
          fi

          SOLUTION_ID=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin)['solutionId'])")
          echo "SOLUTION_ID=$SOLUTION_ID" >> $GITHUB_ENV

      - name: Poll deployment status
        env:
          JOULE_HOST: ${{ secrets.JOULE_STUDIO_HOST }}
          JOULE_TOKEN: ${{ secrets.JOULE_STUDIO_TOKEN }}
        run: |
          # Trigger deploy
          DEPLOY_RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "$JOULE_HOST/build-service/Solutions('$SOLUTION_ID')/versions/main/deploy" \
            -H "Authorization: Bearer $JOULE_TOKEN" \
            -H "Content-Type: application/json")

          HTTP_CODE=$(echo "$DEPLOY_RESPONSE" | tail -1)
          BODY=$(echo "$DEPLOY_RESPONSE" | head -1)

          echo "Deploy response ($HTTP_CODE): $BODY"
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "Deploy trigger failed"
            exit 1
          fi

          JOB_ID=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin)['ID'])")

          # Poll until completed or failed (max 60 attempts = ~10 min)
          for i in $(seq 1 60); do
            sleep 10
            STATUS_RESPONSE=$(curl -s \
              "$JOULE_HOST/build-service/Solutions('$SOLUTION_ID')/versions/main/deploymentJobs('$JOB_ID')" \
              -H "Authorization: Bearer $JOULE_TOKEN")

            STATUS=$(echo "$STATUS_RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status_code','unknown'))")
            echo "[$i] Deployment status: $STATUS"

            if [ "$STATUS" = "succeeded" ]; then
              echo "Deployment succeeded"
              exit 0
            elif [ "$STATUS" = "failed" ]; then
              echo "Deployment failed"
              exit 1
            fi
          done

          echo "Deployment timed out"
          exit 1

      - name: Summary
        if: success()
        run: echo "Agent deployed to production successfully."
